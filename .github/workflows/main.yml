name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential git zip unzip
          pip3 install --upgrade cython virtualenv buildozer
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.0 ndk;25.1.8937393'
          
      - name: Debug check files and environment
        run: |
          ls -la
          echo "--- Environment ---"
          env | grep ANDROID
          echo "--- Checking tools ---"
          which java
          which sdkmanager
          which buildozer
          
      - name: Build APK with Buildozer
        run: |
          # Принудительно указываем путь к NDK, если он не подхватился автоматически
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393
          buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: babygame-apk
          path: bin/*.apk
