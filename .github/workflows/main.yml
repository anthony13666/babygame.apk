name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential git zip unzip
          pip3 install --upgrade cython virtualenv buildozer
          
      # --- НАДЕЖНАЯ УСТАНОВКА SDK С ПРОВЕРКОЙ ---
      - name: Setup Android SDK & Force Accept Licenses
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools/latest/bin
          
          echo "--- Downloading Command Line Tools ---"
          curl https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf $ANDROID_HOME/cmdline-tools/cmdline-tools
          
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          echo "--- Creating License Files Manually (The Only Way That Works) ---"
          mkdir -p $ANDROID_HOME/licenses
          # Эти хеши означают "Я принимаю все лицензии Google"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f93273ebf9ca940ff" >> $ANDROID_HOME/licenses/android-sdk-license
          
          echo "--- Installing Packages ---"
          # Используем sdkmanager напрямую. Если он упадет — скрипт остановится.
          sdkmanager --verbose "platforms;android-33" "build-tools;33.0.0" "ndk;25.1.8937393"
          
          echo "--- VERIFYING INSTALLATION ---"
          if [ ! -d "$ANDROID_HOME/build-tools/33.0.0" ]; then
            echo "ERROR: build-tools folder was NOT created!"
            ls -la $ANDROID_HOME
            exit 1
          fi
          
