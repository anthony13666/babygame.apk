name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Устанавливаем Java и базовые утилиты для сборки
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential git zip unzip
          pip3 install --upgrade cython virtualenv buildozer
          
      # --- ГЛАВНОЕ ИЗМЕНЕНИЕ ЗДЕСЬ ---
      # Используем официальный экшен для установки Android SDK. 
      # Он сам примет все лицензии и установит нужные пакеты.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393'
      
      # Проверяем, что aidl действительно есть после работы экшена
      - name: Verify AIDL installation
        run: |
          echo "--- Checking for aidl ---"
          find $ANDROID_HOME/build-tools -name "aidl" || true
          ls -la $ANDROID_HOME/build-tools/
          
      - name: Build APK with Buildozer
        env:
          # Передаем пути явно, чтобы buildozer их видел
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          # Запускаем сборку с подробным логом (-v), если упадет — будет видно почему
          buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: babygame-apk
          path: bin/*.apk
