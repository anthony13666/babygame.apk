name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential git zip unzip
          pip3 install --upgrade cython virtualenv buildozer
          
      # --- НОВАЯ СТРАТЕГИЯ УСТАНОВКИ SDK ---
      - name: Setup Android SDK manually
        run: |
          echo "--- Downloading Command Line Tools ---"
          mkdir -p $HOME/android-sdk/cmdline-tools/latest/bin
          curl https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
          rm -rf $HOME/android-sdk/cmdline-tools/cmdline-tools
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          
          echo "--- Accepting Licenses ---"
          yes | sdkmanager --licenses || true
          
          echo "--- Installing Specific Versions ---"
          # Ставим СТАБИЛЬНЫЕ версии, которые точно есть и работают со старым NDK
          sdkmanager "platforms;android-33" \
                     "build-tools;30.0.3" \
                     "ndk;25.1.8937393" \
                     "cmake;3.22.1" > /dev/null
          
          echo "--- Creating Symlink for AIDL ---"
          # Buildozer часто ищет aidl в корне build-tools или конкретной папке.
          # Создаем ярлык, чтобы он точно нашел исполняемый файл.
          ln -sf $ANDROID_HOME/build-tools/30.0.3/aidl $ANDROID_HOME/build-tools/aidl || true
          
          # Сохраняем переменные окружения для следующих шагов
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/30.0.3:$PATH" >> $GITHUB_ENV
          
      - name: Verify Environment
        run: |
          which java
          which aidl
          ls $ANDROID_HOME/build-tools/
          
      # --- СБОРКА С ЗАПРЕТОМ ОБНОВЛЕНИЙ ---
      - name: Build APK with Buildozer
        env:
          # Говорим buildozer НЕ трогать установку пакетов, так как мы всё сделали выше
          BUILDOZER_NO_UPDATE_SDK: 1 
          ANDROID_API_MIN: 21
          ANDROID_API_TARGET: 33
          ANDROID_BUILD_TOOLS_VERSION: 30.0.3
          ANDROID_NDK_VERSION: 25.1.8937393
        run: |
          # Используем флаг -v для подробного вывода, если снова упадет
          buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: babygame-apk
          path: bin/*.apk
